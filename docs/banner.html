<!doctype html>
<!-- Source for docs/banner.png (Spanish) and docs/banner.en.png (open with #en).
     Render at 1600x800 with any headless Chromium, e.g.:
     msedge --headless --window-size=1600,800 --screenshot=banner.png docs/banner.html -->
<html lang="es">
<head>
<meta charset="utf-8">
<title>DR Facturación banner</title>
<style>
  :root {
    --paper: #FAFBF8; --grid: rgba(27, 31, 35, 0.05); --ink: #1B1F23; --muted: #5B6570;
    --line: #D9DED9; --accent: #9BE28F; --accent-soft: #EEF8EC; --accent-ink: #2F6B27;
    --mono: "Cascadia Mono", "Cascadia Code", Consolas, "SFMono-Regular", Menlo, monospace;
    --sans: "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1600px; height: 800px; overflow: hidden; }
  body {
    font-family: var(--sans); color: var(--ink); background-color: var(--paper);
    background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 32px 32px; background-position: -1px -1px;
    padding: 64px 80px 56px; display: grid; grid-template-rows: 1fr auto; gap: 40px;
  }
  .top { display: grid; grid-template-columns: 1fr 660px; align-items: center; gap: 40px; }
  .label { font: 600 20px var(--mono); letter-spacing: .18em; color: var(--accent-ink); display: flex; align-items: center; gap: 14px; }
  .label::before { content: ""; width: 14px; height: 14px; border-radius: 3px; background: var(--accent); box-shadow: inset 0 0 0 1.5px rgba(27, 31, 35, .2); }
  h1 { font-size: 92px; line-height: .98; letter-spacing: -.03em; font-weight: 760; margin-top: 26px; max-width: 12ch; }
  .sub { margin-top: 26px; font: 500 24px var(--mono); color: var(--muted); letter-spacing: .02em; }
  .sub b { color: var(--ink); font-weight: 600; }
  .art { width: 660px; height: auto; margin: -40px -20px 0 0; }
  .ways { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
  .way { background: #fff; border: 1.5px solid var(--line); border-radius: 16px; padding: 22px 26px 24px; }
  .way.first { border-color: var(--ink); box-shadow: 0 2px 0 var(--ink); background: var(--accent-soft); }
  .n { font: 600 16px var(--mono); letter-spacing: .14em; color: var(--accent-ink); }
  .way h2 { font-size: 30px; letter-spacing: -.015em; margin-top: 8px; font-weight: 700; }
  .way p { margin-top: 8px; font-size: 19px; color: var(--muted); line-height: 1.35; }
  .way code { white-space: nowrap; font: 500 15.5px var(--mono); color: var(--ink); background: #F1F3F2; border-radius: 6px; padding: 2px 8px; }
  .first .tag { display: inline-block; margin-left: 10px; font: 600 13px var(--mono); letter-spacing: .12em; background: var(--accent); color: #12300F; padding: 3px 8px; border-radius: 6px; vertical-align: 1px; line-height: 1; }
</style>
</head>
<body>
  <div class="top">
    <div>
      <div class="label">DR FACTURACIÓN</div>
      <h1 data-es="Revisa tus facturas antes de declarar" data-en="Check your invoices before you file"></h1>
      <p class="sub"><b>RNC</b> · <b>NCF / e-NCF</b> · <b>ITBIS</b> <span data-es="→ reporte en Excel" data-en="→ Excel report"></span></p>
    </div>
    <img class="art" src="app/ilustracion.webp" alt="">
  </div>
  <div class="ways">
    <div class="way first">
      <div class="n">01<span class="tag" data-es="LA MÁS FÁCIL" data-en="EASIEST"></span></div>
      <h2 data-es="En el navegador" data-en="In your browser"></h2>
      <p data-es="Suelta tu Excel y listo. Tu archivo nunca sale de tu navegador." data-en="Drop your Excel file. It never leaves your browser."></p>
    </div>
    <div class="way">
      <div class="n">02</div>
      <h2 data-es="Con tu agente de IA" data-en="With your AI agent"></h2>
      <p data-es="Claude Code, Codex y otros: instala el skill y pídele que revise tu archivo." data-en="Claude Code, Codex and others: install the skill and ask it to check your file."></p>
    </div>
    <div class="way">
      <div class="n">03</div>
      <h2 data-es="En la terminal" data-en="In the terminal"></h2>
      <p><code>python scripts/check_invoices.py facturas.xlsx</code></p>
    </div>
  </div>
<script>
  const lang = location.hash === "#en" ? "en" : "es";
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-es]").forEach(el => { el.textContent = el.dataset[lang]; });
</script>
</body>
</html>
